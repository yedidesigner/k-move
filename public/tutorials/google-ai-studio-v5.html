<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="K-MOVE 4회차 Google AI Studio · Tools 5개 옵션의 한국어 설명과 모의 설정"><title>Google AI Studio · Tools 한국어 가이드 | K-MOVE</title><style>body{font:15px/1.8 system-ui,sans-serif;margin:0;background:#fff;color:#202124}.loading{padding:40px;max-width:650px;margin:auto}a{color:#1a73e8}</style></head><body><main class="loading" role="status"><h1>Google AI Studio 학습자료</h1><p id="load-status">Tools 옵션 설명을 준비하고 있습니다.</p><a href="" id="retry" hidden>다시 불러오기</a></main>
<script>
(async()=>{
  'use strict';
  const storageScript=`<script>window.kmoveTutorialStorage={memory:{},getItem:function(k){try{return localStorage.getItem(k)}catch(e){return this.memory[k]||null}},setItem:function(k,v){try{localStorage.setItem(k,v)}catch(e){this.memory[k]=String(v)}},removeItem:function(k){try{localStorage.removeItem(k)}catch(e){delete this.memory[k]}}};<\/script>`;
  try{
    const response=await fetch('/tutorials/google-ai-studio-base-v6.html',{cache:'no-store'});
    if(!response.ok)throw new Error('tutorial-unavailable');
    let html=await response.text();
    if(!html.includes('data-help="input-tools"')||!html.includes('</body>'))throw new Error('tutorial-invalid');
    html=html.replace(/\blocalStorage\.(getItem|setItem|removeItem)\(/g,'window.kmoveTutorialStorage.$1(');
    html=html.replace('<head>','<head>'+storageScript);
    html=html.replace('</body>','<script src="/tutorials/ai-studio-tools-v7.js?v=1"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('load-status').textContent='학습자료를 불러오지 못했습니다. 네트워크 연결을 확인한 뒤 다시 열어주세요.';
    document.getElementById('retry').hidden=false;
  }
})();
</script></body></html>
