<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">햄버거 메뉴의 핵심 구조</title>
  <desc id="desc">오른쪽 위의 세 줄 아이콘은 메뉴를 여는 버튼입니다. 그 아래 펼쳐지는 프로젝트, 소개, 문의 목록은 탐색 메뉴입니다.</desc>
  <rect width="560" height="360" rx="20" fill="#f5f5f2"/>
  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#171717" font-size="32">
    <rect x="38" y="42" width="164" height="52" rx="6" fill="#e4f2b4"/>
    <text x="120" y="78" text-anchor="middle">여는 버튼</text>
    <path d="M226 68h164m-10-9 10 9-10 9" fill="none" stroke="#626262" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="426" y="32" width="84" height="76" rx="10" fill="#fff" stroke="#dededb" stroke-width="2"/>
    <path d="M446 53h44m-44 17h44m-44 17h44" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    <path d="M468 109v23" stroke="#626262" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="282" y="132" width="228" height="190" rx="10" fill="#fff" stroke="#dededb" stroke-width="2"/>
    <text x="310" y="182" font-weight="500">프로젝트</text>
    <text x="310" y="237" font-weight="500">소개</text>
    <text x="310" y="292" font-weight="500">문의</text>
    <text x="120" y="233" text-anchor="middle">탐색 목록</text>
    <path d="M214 222h48m-10-9 10 9-10 9" fill="none" stroke="#626262" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
