<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
  <title id="title">CTA의 핵심 구조</title>
  <desc id="desc">디자인 소식을 받아보라는 안내 문장 아래 무료로 시작하기 버튼이 있습니다. 버튼의 문구는 사용자의 다음 행동을 제안합니다.</desc>
  <rect width="560" height="320" rx="20" fill="#f5f5f2"/>
  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#171717">
    <text x="280" y="75" font-size="32" font-weight="500">디자인 소식을 받아보세요.</text>
    <rect x="122" y="109" width="316" height="76" rx="10" fill="#171717"/>
    <text x="280" y="158" font-size="32" font-weight="600" fill="#fff">무료로 시작하기</text>
    <path d="M280 199v20" stroke="#626262" stroke-width="2"/>
    <rect x="115" y="229" width="330" height="56" rx="6" fill="#e4f2b4"/>
    <text x="280" y="268" font-size="32">다음 행동을 제안</text>
  </g>
</svg>
